<section class="product-form-page container">
  <div class="product-form-heading">
    <p class="eyebrow">ADMINISTRAÇÃO</p>
    <h1>Detalhes do produto</h1>
    <p>Preencha as informações para manter seu catálogo completo.</p>
  </div>

  <form class="product-form-card" (ngSubmit)="salvar()">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" type="text" [(ngModel)]="produto.nome" name="nome">
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="preco">Preço</label>
        <div class="input-group">
          <span class="input-group-text">R$</span>
          <input class="form-control" id="preco" type="number" [(ngModel)]="produto.preco" name="preco">
        </div>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="categoria">Categoria</label>
        <input class="form-control" id="categoria" type="text" [(ngModel)]="produto.categoria" name="categoria">
      </div>
      <div class="col-12">
        <label class="form-label" for="imagemUrl">URL da imagem</label>
        <input class="form-control" id="imagemUrl" type="text" [(ngModel)]="produto.imagemUrl" name="imagemUrl">
      </div>
      <div class="col-12">
        <div class="form-check availability-check">
          <input class="form-check-input" id="disponivel" type="checkbox" [(ngModel)]="produto.disponivel" name="disponivel">
          <label class="form-check-label" for="disponivel">Produto disponível</label>
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary save-button" type="submit">Salvar produto</button>
      <button class="btn btn-outline-light cancel-button" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</section>
